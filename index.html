<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03060a">
  <title>LMR Service Auto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #03060a;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 520px;
      line-height: 0;
      overflow: hidden;
    }

    .fond {
      display: block;
      width: 100%;
      height: auto;
    }

    .lien {
      position: absolute;
      left: 7.5%;
      width: 85%;
      display: block;
      z-index: 2;
      background: transparent;
      border: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Zones calibrées sur l'image complète */
    .instagram {
      top: 41.5%;
      height: 6.8%;
    }

    .tiktok {
      top: 49.3%;
      height: 6.8%;
    }

    .snapchat {
      top: 57.1%;
      height: 6.8%;
    }

    .email {
      top: 64.9%;
      height: 6.8%;
    }

    .telephone {
      top: 73.3%;
      height: 6.7%;
    }

    @media (min-width: 521px) {
      body {
        padding: 20px 0;
      }

      .page {
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 60px #000;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <img
      class="fond"
      src="lmr-screen.jpg"
      alt="LMR Service Auto - Nos réseaux et nos coordonnées"
    >

    <a
      class="lien instagram"
      href="https://www.instagram.com/lmrserviceauto/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ouvrir Instagram LMR Service Auto"
    ></a>

    <a
      class="lien tiktok"
      href="https://www.tiktok.com/@lmrserviceauto"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ouvrir TikTok LMR Service Auto"
    ></a>

    <a
      class="lien snapchat"
      href="https://snapchat.com/t/JihInxai"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ouvrir Snapchat LMR Service Auto"
    ></a>

    <a
      class="lien email"
      href="mailto:contact@lmrserviceauto.fr"
      aria-label="Envoyer un email à LMR Service Auto"
    ></a>

    <a
      class="lien telephone"
      href="tel:+33183846796"
      aria-label="Appeler LMR Service Auto"
    ></a>

  </main>
</body>
</html>
